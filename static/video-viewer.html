<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Viewer</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .transcript-container {
            height: 300px;
            overflow-y: auto;
            background: #fff;
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }
        
        .transcript-text {
            white-space: pre-wrap;
        }
        
        .speaker-segment {
            margin-bottom: 15px;
            padding: 10px;
            border-left: 3px solid #007bff;
            background: #f8f9fa;
        }
        
        .timestamp {
            color: #6c757d;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-12">
                <a href="index.html" class="btn btn-secondary mb-3" onclick="event.preventDefault(); window.history.back();">← Back to Dashboard</a>
                <h1 class="text-center">Video Viewer</h1>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12 mb-4">
                <div class="video-container">
                    <video id="mainVideo" controls class="w-100">
                        <source src="" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <h3>Pure Transcript</h3>
                <div class="transcript-container">
                    <div id="pureTranscript" class="transcript-text">
                        Loading transcript...
                    </div>
                </div>
            </div>
            
            <div class="col-md-6 mb-4">
                <h3>Diarized Transcript</h3>
                <div class="transcript-container">
                    <div id="diarizedTranscript" class="transcript-text">
                        Loading transcript...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="viewer.js"></script>
</body>
</html>
